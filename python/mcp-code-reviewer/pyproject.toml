[project]
name = "mcp-code-reviewer"
version = "0.1.0"
description = "MCP server that reviews code with YAML checklists"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==2.3.0",
    "pyyaml==6.0.3",
]

[project.scripts]
mcp-code-reviewer = "main:mcp.run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
