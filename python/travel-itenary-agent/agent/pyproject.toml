[project]
name = "travel-agent"
version = "0.3.0"
description = "AI Travel Itinerary Planner agent that speaks A2UI v0.9 (tutorial code)"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.25,<0.26",
    "fastapi>=0.163",
    "uvicorn[standard]>=0.54",
    "sse-starlette>=3.7",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
]

[project.scripts]
travel-cli = "travel_agent.cli:main"
travel-server = "travel_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real OpenAI API (needs OPENAI_API_KEY)"]
addopts = "-m 'not live'"
